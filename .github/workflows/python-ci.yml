name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with Python
      run: |
        python -m py_compile solar_assistant_bot.py
        python -m py_compile setup.py
        python -m py_compile test_monitoring.py
        python -m py_compile debug_login.py
    - name: Run Tests
      run: |
        python -m pytest tests/ -v --tb=short || echo "No tests found or tests skipped"
